# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.
#
# Goal: `flutter analyze` shows 0 issues. Run it in CI and fail the build on
# any issue, so the project does not slowly get dirty again.

# Lint rules: very_good_analysis, PINNED to version 11.0.0.
# The pinned file name means new lints never appear by surprise after a
# package update. To upgrade on purpose:
#   1. Change the version here AND in pubspec.yaml (dev_dependencies).
#   2. Run `flutter analyze` and fix the new issues in a separate commit.
include: package:very_good_analysis/analysis_options.11.0.0.yaml

# Disabled rules. Every disabled rule must have a one-line reason.
linter:
  rules:
    # App, not a library. No one imports our API, so doc comments add noise.
    public_member_api_docs: false
    # Tests read better with plain calls; cascades add no value there.
    cascade_invocations: false
    # A named method like set(value: x) is clearer than a setter here.
    use_setters_to_change_properties: false

analyzer:
  # Generated and platform folders are not our code.
  exclude:
    - build/**
    - android/**
    - web/**
    - ios/**
    - '**/*.g.dart'

  # CHANGED: this block was a top-level `language:` key. The analyzer only
  # reads it inside `analyzer:`, so it was ignored. It is now in the right place.
  # Strict type checks: no hidden `dynamic`, no unsafe casts.
  # (very_good_analysis also turns these on. We keep them here on purpose.)
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

# Inline `// ignore:` comments in the code (rare, always with a reason):
#   - lib/core/api/dio_api_client.dart: avoid_catching_errors
#     (parse() throws TypeError when the server JSON has a wrong shape)